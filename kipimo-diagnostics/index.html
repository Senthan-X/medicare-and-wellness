.cta{background:#18283e;color:white;padding:76px 0}.cta-row{display:flex;align-items:center;justify-content:space-between;gap:30px}.cta h2{font:400 clamp(34px,4.6vw,57px)/1.03 Georgia,serif;letter-spacing:-.045em;margin:8px 0 12px;max-width:660px}.cta p{color:rgba(255,255,255,.7);font-size:14px;margin:0;max-width:560px}.cta .eyebrow{color:#ffb29b}
footer{background:var(--paper);padding:42px 0 25px}.footer-main{display:flex;justify-content:space-between;gap:35px;padding-bottom:36px;border-bottom:1px solid var(--line)}.footer-brand p{font-size:12px;color:var(--muted);margin:15px 0 0;max-width:330px}.footer-contact{display:flex;gap:48px;font-size:12px;color:var(--muted)}.footer-contact strong{display:block;color:var(--ink);font-size:12px;margin-bottom:8px}.footer-bottom{display:flex;justify-content:space-between;gap:24px;padding-top:20px;color:var(--muted);font-size:10px;letter-spacing:.03em}.backtop{position:fixed;z-index:15;right:22px;bottom:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 6px 20px rgba(0,0,0,.1);opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s;cursor:pointer}.backtop.show{opacity:1;pointer-events:auto;transform:none}.reveal{opacity:0;transform:translateY(18px);transition:opacity .65s ease,transform .65s ease}.reveal.visible{opacity:1;transform:none}.service-card:nth-child(2),.step:nth-child(2){transition-delay:.08s}.service-card:nth-child(3),.step:nth-child(3){transition-delay:.16s}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
html[dir="rtl"] body{font-family:Tahoma,Arial,sans-serif}html[dir="rtl"] .intro-tag{border-left:0;border-right:2px solid var(--accent);padding:0 15px 0 0}html[dir="rtl"] .step:not(:last-child)::after{right:auto;left:22px}html[dir="rtl"] .plan-result{border-left:0;border-right:2px solid var(--accent)}html[dir="rtl"] .team-photo::after{background:linear-gradient(0deg,rgba(14,24,39,.75),transparent)}html[dir="rtl"] .footer-contact{text-align:right}
@media(max-width:980px){nav{gap:14px}.navrow{gap:14px}.service-grid{grid-template-columns:repeat(2,1fr)}.section{padding:86px 0}.planner-grid{gap:38px}.intro-grid{gap:40px}}
